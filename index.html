<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sheldgram</title>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>
body{margin:0;font-family:system-ui;background:#0f172a;color:#e5e7eb;height:100vh;display:flex}
#auth,#app{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center}
input,button{padding:12px;margin:6px;border-radius:10px;border:0}
button{background:#22d3ee;font-weight:700}
#chat{display:none;flex-direction:column;height:100%}
#messages{flex:1;overflow:auto;padding:10px}
.msg{background:#1e293b;padding:8px;border-radius:10px;margin:4px}
#send{display:flex}
#send input{flex:1}
</style>
</head>

<body>

<div id="auth">
<h2>Sheldgram</h2>
<input id="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">
<button onclick="login()">Войти</button>
<button onclick="register()">Регистрация</button>
<p id="authMsg"></p>
</div>

<div id="chat">
<div id="messages"></div>
<div id="send">
<input id="text" placeholder="Сообщение">
<button onclick="send()">➤</button>
</div>
<button onclick="logout()">Выйти</button>
</div>

<script>
const firebaseConfig = {
 apiKey: "AIzaSyCMX9CJ_pdfWSHfjOQxNgOI3nVV9TKQQL0",
 authDomain: "sheldgram.firebaseapp.com",
 databaseURL: "https://sheldgram-default-rtdb.firebaseio.com",
 projectId: "sheldgram",
 storageBucket: "sheldgram.firebasestorage.app",
 messagingSenderId: "1043405821108",
 appId: "1:1043405821108:web:5f6cd85ab9879c9494b3e1"
};
firebase.initializeApp(firebaseConfig);
const auth=firebase.auth();
const db=firebase.database();

const authDiv=document.getElementById("auth");
const chatDiv=document.getElementById("chat");
const messages=document.getElementById("messages");

auth.onAuthStateChanged(u=>{
 if(u){
  authDiv.style.display="none";
  chatDiv.style.display="flex";
  load();
 }else{
  authDiv.style.display="flex";
  chatDiv.style.display="none";
 }
});

function register(){
 auth.createUserWithEmailAndPassword(email.value,password.value)
 .catch(e=>authMsg.textContent=e.message);
}
function login(){
 auth.signInWithEmailAndPassword(email.value,password.value)
 .catch(e=>authMsg.textContent=e.message);
}
function logout(){auth.signOut();}

let loaded=false;
function load(){
 if(loaded)return;
 loaded=true;
 db.ref("global").limitToLast(100).on("child_added",s=>{
  const d=s.val();
  const div=document.createElement("div");
  div.className="msg";
  div.textContent=d.user+": "+d.text;
  messages.appendChild(div);
  messages.scrollTop=messages.scrollHeight;
 });
}

function send(){
 if(!text.value)return;
 db.ref("global").push({
  user:auth.currentUser.email,
  text:text.value,
  t:Date.now()
 });
 text.value="";
}
</script>
</body>
</html>
