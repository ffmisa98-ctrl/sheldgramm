<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Sheldgram — Stage 1</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>
:root{
  --bg:#0f172a;
  --panel:#020617;
  --accent:#38bdf8;
  --text:#e5e7eb;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:system-ui,Segoe UI,Roboto;
  background:var(--bg);
  color:var(--text);
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
}
button,input{
  border:none;
  border-radius:10px;
  padding:10px;
  font-size:15px;
}
button{
  background:var(--accent);
  color:#000;
  font-weight:600;
}
input{width:100%;margin-bottom:10px}
#auth,#app{
  width:100%;
  max-width:420px;
  height:100vh;
  background:var(--panel);
  display:flex;
  flex-direction:column;
}
header{
  padding:14px;
  text-align:center;
  font-weight:700;
  background:#020617;
  border-bottom:1px solid #1e293b;
}
#authBox{
  padding:20px;
}
#chat{
  flex:1;
  overflow-y:auto;
  padding:10px;
}
.msg{
  margin:6px 0;
  padding:8px 10px;
  border-radius:10px;
  max-width:80%;
  word-wrap:break-word;
}
.me{background:var(--accent);color:#000;margin-left:auto}
.other{background:#1e293b}
#sendBox{
  display:flex;
  padding:10px;
  gap:6px;
}
#sendBox input{flex:1;margin:0}
#topBar{
  display:flex;
  justify-content:space-between;
  align-items:center;
}
#logout{background:#ef4444;color:white}
.hidden{display:none}
</style>
</head>
<body>

<div id="auth">
  <header>Sheldgram</header>
  <div id="authBox">
    <input id="email" placeholder="Email">
    <input id="password" type="password" placeholder="Пароль">
    <input id="nickname" placeholder="Никнейм (при регистрации)">
    <button onclick="login()">Войти</button>
    <button onclick="register()">Регистрация</button>
    <p id="authMsg"></p>
  </div>
</div>

<div id="app" class="hidden">
  <header id="topBar">
    <span id="userNick"></span>
    <button id="logout" onclick="logout()">Выйти</button>
  </header>
  <div id="chat"></div>
  <div id="sendBox">
    <input id="message" placeholder="Сообщение">
    <button onclick="send()">➤</button>
  </div>
</div>

<script>
/* ===== FIREBASE CONFIG ===== */
firebase.initializeApp({
  apiKey: "AIzaSyCMX9CJ_pdfWSHfjOQxNgOI3nVV9TKQQL0",
  authDomain: "sheldgram.firebaseapp.com",
  databaseURL: "https://sheldgram-default-rtdb.firebaseio.com",
  projectId: "sheldgram",
  storageBucket: "sheldgram.firebasestorage.app",
  messagingSenderId: "1043405821108",
  appId: "1:1043405821108:web:5f6cd85ab9879c9494b3e1"
});

const auth = firebase.auth();
const db = firebase.database();

const authScreen = document.getElementById("auth");
const appScreen = document.getElementById("app");
const authMsg = document.getElementById("authMsg");
const chatBox = document.getElementById("chat");
const userNick = document.getElementById("userNick");

let currentUser = null;
let chatRef = null;

/* ===== AUTH ===== */
function register(){
  const email=email.value;
  const pass=password.value;
  const nick=nickname.value.trim();
  if(!email||!pass||!nick) return authMsg.textContent="Заполни всё";
  auth.createUserWithEmailAndPassword(email,pass)
    .then(res=>{
      return db.ref("users/"+res.user.uid).set({nick});
    })
    .catch(e=>authMsg.textContent=e.message);
}

function login(){
  auth.signInWithEmailAndPassword(email.value,password.value)
    .catch(e=>authMsg.textContent=e.message);
}

function logout(){
  auth.signOut();
}

/* ===== STATE ===== */
auth.onAuthStateChanged(user=>{
  if(user){
    currentUser=user;
    authScreen.classList.add("hidden");
    appScreen.classList.remove("hidden");
    loadUser();
    openChat();
  }else{
    appScreen.classList.add("hidden");
    authScreen.classList.remove("hidden");
  }
});

function loadUser(){
  db.ref("users/"+currentUser.uid).once("value").then(snap=>{
    userNick.textContent=snap.val().nick;
  });
}

/* ===== CHAT ===== */
function openChat(){
  chatBox.innerHTML="";
  if(chatRef) chatRef.off();
  chatRef=db.ref("global");
  chatRef.limitToLast(100).on("child_added",snap=>{
    render(snap.val());
  });
}

function send(){
  const text=message.value.trim();
  if(!text) return;
  db.ref("global").push({
    uid:currentUser.uid,
    text,
    time:Date.now()
  });
  message.value="";
}

function render(msg){
  const div=document.createElement("div");
  div.className="msg "+(msg.uid===currentUser.uid?"me":"other");
  div.textContent=msg.text;
  chatBox.appendChild(div);
  chatBox.scrollTop=chatBox.scrollHeight;
}
</script>

</body>
</html>
