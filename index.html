<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Sheldgram</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<style>
body{margin:0;font-family:system-ui;background:#111;color:#fff}
.screen{display:none;padding:20px}
.screen.active{display:block}
input,button{width:100%;padding:14px;border-radius:12px;border:none;margin:8px 0;font-size:16px}
button{background:#2ea6ff;color:#fff;font-weight:600}
.chat{padding:12px;border-bottom:1px solid #222;cursor:pointer}
</style>
</head>
<body>

<div id="auth" class="screen active">
  <h2>Sheldgram</h2>
  <input id="email" placeholder="Email">
  <input id="password" type="password" placeholder="Пароль">
  <input id="nick" placeholder="Ник (для регистрации)">
  <button onclick="login()">Войти</button>
  <button onclick="register()">Регистрация</button>
</div>

<div id="chats" class="screen">
  <h3>Чаты</h3>
  <div id="chatList"></div>
  <button onclick="logout()">Выйти</button>
</div>

<script>
const firebaseConfig = {
  apiKey: "PASTE_KEY",
  authDomain: "PASTE_DOMAIN",
  projectId: "PASTE_ID"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

function show(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function login(){
  auth.signInWithEmailAndPassword(
    email.value.trim(),
    password.value
  ).catch(e=>alert(e.message));
}

function register(){
  if(!nick.value) return alert("Введи ник");
  auth.createUserWithEmailAndPassword(
    email.value.trim(),
    password.value
  ).then(cred=>{
    return cred.user.updateProfile({displayName:nick.value});
  }).catch(e=>alert(e.message));
}

function logout(){
  auth.signOut();
}

auth.onAuthStateChanged(user=>{
  if(user){
    show('chats');
    loadChats();
  }else{
    show('auth');
  }
});

function loadChats(){
  chatList.innerHTML="";
  db.collection("chats").orderBy("last","desc").onSnapshot(snap=>{
    chatList.innerHTML="";
    snap.forEach(d=>{
      const c=d.data();
      const div=document.createElement("div");
      div.className="chat";
      div.textContent=c.title || "Чат";
      chatList.appendChild(div);
    });
  });
}
</script>

</body>
</html>
