<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Sheldgram</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(#0f172a, #020617);
      color: white;
    }
    header {
      padding: 12px;
      background: #020617;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    button {
      padding: 10px 14px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    .primary { background: #22d3ee; color: black; }
    .danger { background: #ef4444; color: white; }
    input {
      width: 100%;
      padding: 12px;
      margin-bottom: 10px;
      border-radius: 8px;
      border: none;
      font-size: 16px;
    }
    .box {
      max-width: 400px;
      margin: 30px auto;
      padding: 20px;
    }
    .hidden { display: none; }
    .error { color: #f87171; margin-top: 10px; }
  </style>
</head>
<body>

<header>
  <div><b>Sheldgram</b></div>
  <button id="logoutBtn" class="danger hidden">Выйти</button>
</header>

<div class="box" id="authBox">
  <input id="email" type="email" placeholder="Email">
  <input id="password" type="password" placeholder="Пароль">
  <input id="nickname" type="text" placeholder="Ник (только для регистрации)">
  <button class="primary" onclick="login()">Войти</button>
  <br><br>
  <button class="primary" onclick="register()">Регистрация</button>
  <div class="error" id="error"></div>
</div>

<div class="box hidden" id="appBox">
  <h3>Чаты</h3>
  <p>Тут дальше будут чаты как в Telegram</p>
</div>

<script>
  // 🔥 ВСТАВЬ СВОЙ FIREBASE CONFIG СЮДА
  const firebaseConfig = {
    apiKey: "ВСТАВЬ",
    authDomain: "ВСТАВЬ",
    projectId: "ВСТАВЬ",
    appId: "ВСТАВЬ"
  };

  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();

  const authBox = document.getElementById("authBox");
  const appBox = document.getElementById("appBox");
  const errorBox = document.getElementById("error");
  const logoutBtn = document.getElementById("logoutBtn");

  function showError(text) {
    errorBox.innerText = text;
  }

  function login() {
    const email = email.value.trim();
    const password = document.getElementById("password").value;

    if (!email || !password) {
      showError("Заполни email и пароль");
      return;
    }

    auth.signInWithEmailAndPassword(email, password)
      .catch(err => showError(err.message));
  }

  function register() {
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const nick = document.getElementById("nickname").value.trim();

    if (!email || !password || !nick) {
      showError("Заполни все поля");
      return;
    }

    auth.createUserWithEmailAndPassword(email, password)
      .then(() => {
        return auth.currentUser.updateProfile({ displayName: nick });
      })
      .catch(err => showError(err.message));
  }

  logoutBtn.onclick = () => auth.signOut();

  auth.onAuthStateChanged(user => {
    if (user) {
      authBox.classList.add("hidden");
      appBox.classList.remove("hidden");
      logoutBtn.classList.remove("hidden");
    } else {
      authBox.classList.remove("hidden");
      appBox.classList.add("hidden");
      logoutBtn.classList.add("hidden");
    }
  });
</script>

</body>
</html>
