
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sheldgram</title>
<style>
body {
  margin: 0;
  background:#111;
  color:#fff;
  font-family: -apple-system,BlinkMacSystemFont,Segoe UI,Roboto;
}
header {
  padding:15px;
  font-size:22px;
  font-weight:600;
  background:#1c1c1c;
}
#login, #app {
  padding:20px;
}
input, button {
  width:100%;
  padding:14px;
  margin-top:10px;
  border:none;
  border-radius:12px;
  font-size:16px;
}
button {
  background:#2aa8ff;
  color:#000;
  font-weight:600;
}
.chat {
  display:flex;
  align-items:center;
  padding:12px;
  border-bottom:1px solid #222;
}
.avatar {
  width:48px;
  height:48px;
  border-radius:50%;
  background:#444;
  margin-right:12px;
}
.chat-info {
  flex:1;
}
.chat-name {
  font-weight:600;
}
.chat-last {
  color:#aaa;
  font-size:14px;
}
.time {
  color:#888;
  font-size:12px;
}
</style>
</head>
<body>

<header>Sheldgram</header>

<div id="login">
  <input id="nick" placeholder="Введите ник">
  <button onclick="saveNick()">Продолжить</button>
</div>

<div id="app" style="display:none;">
  <div class="chat">
    <div class="avatar"></div>
    <div class="chat-info">
      <div class="chat-name">Общий чат</div>
      <div class="chat-last">Добро пожаловать</div>
    </div>
    <div class="time">now</div>
  </div>
</div>

<script>
function saveNick() {
  const nick = document.getElementById('nick').value.trim();
  if(!nick) return alert("Введите ник");
  localStorage.setItem("nickname", nick);
  start();
}

function start() {
  const nick = localStorage.getItem("nickname");
  if(!nick || nick==="undefined") {
    document.getElementById("login").style.display="block";
    document.getElementById("app").style.display="none";
  } else {
    document.getElementById("login").style.display="none";
    document.getElementById("app").style.display="block";
  }
}
start();
</script>

</body>
</html>
