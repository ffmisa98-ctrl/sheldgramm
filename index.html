<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sheldgram</title>
<style>
body{margin:0;font-family:system-ui;background:#0e1621;color:#fff}
header{padding:14px;text-align:center;font-weight:600;background:#17212b}
button{background:#2ea6ff;border:none;color:#fff;padding:12px;border-radius:10px;width:100%;font-size:16px}
input{width:100%;padding:12px;border-radius:10px;border:none;margin-bottom:10px}
.screen{padding:16px}
.chat{padding:12px;border-bottom:1px solid #1f2a36;cursor:pointer}
.chat:hover{background:#1f2a36}
.msg{margin:6px 0}
.me{color:#2ea6ff}
</style>
</head>
<body>
<header>Sheldgram</header>

<div id="auth" class="screen">
<input id="email" placeholder="Email" />
<input id="pass" type="password" placeholder="Пароль" />
<input id="nick" placeholder="Ник" />
<button onclick="register()">Регистрация</button><br><br>
<button onclick="login()">Войти</button>
</div>

<div id="main" class="screen" style="display:none">
<button onclick="logout()">Выйти</button><br><br>
<input id="search" placeholder="Поиск пользователей" oninput="searchUsers()" />
<div id="users"></div>
<h3>Общий чат</h3>
<div id="chat"></div>
<input id="msg" placeholder="Сообщение" />
<button onclick="send()">Отправить</button>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js';
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut } from 'https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js';
import { getDatabase, ref, set, push, onValue } from 'https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js';

const firebaseConfig = {
 apiKey: "AIzaSyCMX9CJ_pdfWSHfjOQxNgOI3nVV9TKQQL0",
 authDomain: "sheldgram.firebaseapp.com",
 databaseURL: "https://sheldgram-default-rtdb.firebaseio.com",
 projectId: "sheldgram",
 storageBucket: "sheldgram.firebasestorage.app",
 messagingSenderId: "1043405821108",
 appId: "1:1043405821108:web:5f6cd85ab9879c9494b3e1"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);
let uid=null,nick=null;

window.register=()=>{
 createUserWithEmailAndPassword(auth,email.value,pass.value).then(r=>{
 uid=r.user.uid;nick=nick.value||'user';
 set(ref(db,'users/'+uid),{nick});
 show();
 });
}

window.login=()=>{
 signInWithEmailAndPassword(auth,email.value,pass.value).then(r=>{
 uid=r.user.uid;
 onValue(ref(db,'users/'+uid),s=>{nick=s.val().nick;show();});
 });
}

window.logout=()=>{signOut(auth);location.reload();}

function show(){auth.style.display='none';main.style.display='block';loadChat();}

function loadChat(){
 onValue(ref(db,'global'),s=>{
 chat.innerHTML='';
 s.forEach(m=>{
 const d=m.val();
 const div=document.createElement('div');
 div.className='msg '+(d.uid===uid?'me':'');
 div.textContent=d.nick+': '+d.text;
 chat.appendChild(div);
 });
 });
}

window.send=()=>{
 if(!msg.value) return;
 push(ref(db,'global'),{uid,nick,text:msg.value});
 msg.value='';
}

window.searchUsers=()=>{
 onValue(ref(db,'users'),s=>{
 users.innerHTML='';
 s.forEach(u=>{
 if(u.val().nick.includes(search.value)){
 const d=document.createElement('div');d.className='chat';d.textContent=u.val().nick;users.appendChild(d);
 }
 });
 });
}
</script>
</body>
</html>
