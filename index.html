<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Sheldgram</title>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>
body {
  margin: 0;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
  background: #0f172a;
  color: #fff;
}
header {
  background: #020617;
  padding: 14px;
  text-align: center;
  font-weight: 600;
}
button {
  background: #38bdf8;
  border: none;
  padding: 12px;
  border-radius: 10px;
  font-size: 16px;
  cursor: pointer;
}
input {
  width: 100%;
  padding: 12px;
  margin: 6px 0;
  border-radius: 10px;
  border: none;
}
.hidden { display:none; }
.chat {
  padding: 10px;
  height: calc(100vh - 200px);
  overflow-y: auto;
}
.msg {
  margin-bottom: 8px;
  background: #1e293b;
  padding: 8px;
  border-radius: 8px;
}
.footer {
  display: flex;
  gap: 6px;
  padding: 10px;
}
.footer input {
  flex: 1;
}
</style>
</head>

<body>

<header>Sheldgram</header>

<div id="auth">
  <input id="email" placeholder="Email">
  <input id="password" type="password" placeholder="Пароль">
  <input id="nickname" placeholder="Ник">
  <button onclick="register()">Регистрация</button>
  <button onclick="login()">Войти</button>
</div>

<div id="app" class="hidden">
  <button onclick="logout()">Выйти</button>
  <div class="chat" id="chat"></div>
  <div class="footer">
    <input id="message" placeholder="Сообщение">
    <button onclick="sendMessage()">Отправить</button>
  </div>
</div>

<script>
// FIREBASE CONFIG — ДОЛЖЕН БЫТЬ ТВОЙ
const firebaseConfig = {
  apiKey: "PASTE_YOUR_API_KEY",
  authDomain: "PASTE.firebaseapp.com",
  databaseURL: "https://PASTE.firebaseio.com",
  projectId: "PASTE",
  storageBucket: "PASTE.appspot.com",
  messagingSenderId: "PASTE",
  appId: "PASTE"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.database();

function register() {
  const email = email.value;
  const pass = password.value;
  const nick = nickname.value;
  if (!nick) return alert("Ник обязателен");

  auth.createUserWithEmailAndPassword(email, pass)
    .then(res => {
      db.ref("users/" + res.user.uid).set({ nick });
    })
    .catch(e => alert(e.message));
}

function login() {
  auth.signInWithEmailAndPassword(email.value, password.value)
    .catch(e => alert(e.message));
}

function logout() {
  auth.signOut();
}

auth.onAuthStateChanged(user => {
  if (user) {
    authDiv(false);
    loadChat();
  } else {
    authDiv(true);
  }
});

function authDiv(showAuth) {
  document.getElementById("auth").classList.toggle("hidden", !showAuth);
  document.getElementById("app").classList.toggle("hidden", showAuth);
}

function sendMessage() {
  const text = message.value;
  if (!text) return;
  const uid = auth.currentUser.uid;

  db.ref("users/" + uid).once("value").then(snap => {
    const nick = snap.val().nick;
    db.ref("messages").push({
      nick,
      text,
      time: Date.now()
    });
    message.value = "";
  });
}

function loadChat() {
  const chat = document.getElementById("chat");
  chat.innerHTML = "";
  db.ref("messages").limitToLast(100).on("child_added", snap => {
    const m = snap.val();
    const div = document.createElement("div");
    div.className = "msg";
    div.innerText = m.nick + ": " + m.text;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
  });
}
</script>
</body>
</html>
