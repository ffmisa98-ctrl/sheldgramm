<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sheldgram</title>
<style>
body {
  margin: 0;
  background:#0f172a;
  color:#fff;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
}
.header{
  padding:16px;
  font-size:22px;
  font-weight:700;
  background:#020617;
}
.chat-list{
  padding:10px;
}
.chat{
  display:flex;
  align-items:center;
  padding:12px;
  border-radius:16px;
  margin-bottom:8px;
  background:#020617;
}
.chat img{
  width:52px;
  height:52px;
  border-radius:50%;
  margin-right:12px;
}
.chat-info{
  flex:1;
}
.chat-title{
  font-weight:600;
}
.chat-last{
  font-size:14px;
  opacity:.7;
}
.chat-time{
  font-size:12px;
  opacity:.6;
}
</style>
</head>
<body>

<div class="header">Sheldgram</div>

<div class="chat-list">
  <div class="chat">
    <img src="https://i.pravatar.cc/150?img=1">
    <div class="chat-info">
      <div class="chat-title">ЧАТ Джана ❤️</div>
      <div class="chat-last">привет блять</div>
    </div>
    <div class="chat-time">01:31</div>
  </div>

  <div class="chat">
    <img src="https://i.pravatar.cc/150?img=2">
    <div class="chat-info">
      <div class="chat-title">СерыйДжан 🔥</div>
      <div class="chat-last">короче если тг ляжет…</div>
    </div>
    <div class="chat-time">01:28</div>
  </div>

  <div class="chat">
    <img src="https://i.pravatar.cc/150?img=3">
    <div class="chat-info">
      <div class="chat-title">Это Ростов</div>
      <div class="chat-last">Да вы меня даже трог…</div>
    </div>
    <div class="chat-time">01:48</div>
  </div>
</div>

</body>
</html>
